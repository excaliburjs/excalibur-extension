name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck

      - run: npm run build:chrome
      - run: npm run build:firefox

      - name: Compute version
        id: ver
        run: |
          DESCRIBE=$(git describe --tags --always)
          VERSION=${DESCRIBE#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Zip chrome build (contents, not the dist-chrome folder)
        working-directory: dist-chrome
        run: zip -r "../chrome-${{ steps.ver.outputs.version }}.zip" .

      - name: Zip firefox build (contents, not the dist-firefox folder)
        working-directory: dist-firefox
        run: zip -r "../ff-${{ steps.ver.outputs.version }}.zip" .

      - name: Zip source (root minus node_modules and build artifacts)
        run: |
          zip -r "ex-${{ steps.ver.outputs.version }}-source.zip" . \
            -x 'node_modules/*' '.git/*' '.parcel-cache/*' \
            'dist/*' 'dist-chrome/*' 'dist-firefox/*' 'releases/*' \
            '*.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-${{ steps.ver.outputs.version }}
          path: chrome-${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ff-${{ steps.ver.outputs.version }}
          path: ff-${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ex-${{ steps.ver.outputs.version }}-source
          path: ex-${{ steps.ver.outputs.version }}-source.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chrome-${{ steps.ver.outputs.version }}.zip
            ff-${{ steps.ver.outputs.version }}.zip
            ex-${{ steps.ver.outputs.version }}-source.zip
